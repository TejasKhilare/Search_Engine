name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches-ignore: [main]  # main is tested by deploy-backend.yml before deploying
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:  # reused by deploy-backend.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docsearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d docsearch"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsearch
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      # Tests use fakes for OpenAI and object storage; the MinIO integration test skips
      OPENAI_API_KEY: ""
      MINIO_ACCESS_KEY: none
      MINIO_SECRET_KEY: none

    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q
